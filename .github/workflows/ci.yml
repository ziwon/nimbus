name: ci

on:
  push:
  pull_request:

jobs:
  test-and-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.43.0"
      - name: Install Zig 0.16.0
        run: python -m pip install ziglang==0.16.0
      - name: Check, test, and cross-compile
        run: ZIG="python -m ziglang" just ci
      - uses: actions/upload-artifact@v4
        with:
          name: nimbus-release
          path: zig-out/releases/
